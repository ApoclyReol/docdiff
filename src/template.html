  <style>
    @font-face {
      font-family: 'Geist';
      src: url('data:font/woff2;base64,__GEIST_B64__') format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Geist';
      src: url('data:font/woff2;base64,__GEIST_GREEK_B64__') format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
      unicode-range: U+0370-03FF;
    }
    @font-face {
      font-family: 'Geist Mono';
      src: url('data:font/woff2;base64,__GEIST_MONO_B64__') format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --font-sans: 'Geist', system-ui, -apple-system, sans-serif;
      --font-mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;

      --text-4xs: 0.625rem;         /* 10px */
      --text-2xs: 0.6875rem;        /* 11px */
      --text-xs: 0.75rem;           /* 12px */
      --text-chat-label: 0.8125rem; /* 13px */
      --text-sm: 0.875rem;          /* 14px */
      --text-base: 1rem;            /* 16px */

      --radius-md: 0.25rem;         /* 4px */
      --radius-sm: 0.125rem;        /* 2px */
      --radius-xl: 0.75rem;         /* 12px */

      --background: 0 0% 98%;
      --foreground: 215 20% 20%;
      --card: 0 0% 100%;

      --ton-1: 0 0% 94.9%;
      --ton-2: 0 0% 92.2%;
      --ton-3: 0 0% 90.2%;

      --muted-foreground: 215 20% 30.2%;
      --secondary: 0 0% 78.8%;
      --secondary-foreground: 0 0% 9%;

      --border: 0 0% 87.4%;
      --input: 0 0% 87.4%;
      --ring: 212.8 100% 48.4%;
      --trenner: 0 0% 49%;

      --kante-200: rgb(0 0 0 / 0.082);
      --kante-300: rgb(0 0 0 / 0.102);
      --kante-500: rgb(0 0 0 / 0.212);

      --primary: 212.8 100% 36%;
      --primary-foreground: 0 0% 100%;
      --primary-ink: 213.5 100% 40.2%;
      --primary-ton-1: 212.8 100.0% 97.0%;

      --destructive: 347.4 100% 35%;
      --destructive-ink: 351 100% 38.5%;
      --destructive-ton-1: 347.4 100.0% 97.0%;
      --destructive-ton-2: 347.4 100.0% 94.5%;

      --success: 134.9 61.7% 43.3%;
      --success-ink: 138.7 77.3% 24.7%;
      --success-ton-1: 134.9 61.7% 97.0%;
      --success-ton-2: 134.9 61.7% 94.5%;

      --warning-ton-2: 41.9 100.0% 94.5%;

      --elev-1: 0px 2px 2px #0000000a;
      --elev-4: 0px 1px 1px #00000005, 0px 8px 16px -4px #0000000a, 0px 24px 32px -8px #0000000f;
      --overlay: rgb(0 0 0 / 0.8);
    }

    .dark {
      --background: 0 0% 0%;
      --foreground: 0 0% 92.9%;
      --card: 0 0% 0%;

      --ton-1: 0.0 0.0% 10.2%;
      --ton-2: 0.0 0.0% 12.2%;
      --ton-3: 0.0 0.0% 16.1%;

      --muted-foreground: 240 6% 74%;
      --secondary: 0 0% 27.1%;
      --secondary-foreground: 0 0% 92.9%;

      --border: 0 0% 18%;
      --input: 0 0% 18%;
      --ring: 209.8 100% 65.7%;
      --trenner: 0 0% 49%;

      --kante-200: rgb(255 255 255 / 0.09);
      --kante-300: rgb(255 255 255 / 0.13);
      --kante-500: rgb(255 255 255 / 0.24);

      --primary: 212.4 100% 35.7%;
      --primary-foreground: 0 0% 100%;
      --primary-ink: 212.4 100% 74.9%;
      --primary-ton-1: 218.1 81.3% 12.5%;

      --destructive: 355 87.2% 37%;
      --destructive-ink: 356 100% 74.3%;
      --destructive-ton-1: 354.5 64.7% 13.3%;
      --destructive-ton-2: 355.0 69.2% 18.0%;

      --success: 132.5 62.6% 42%;
      --success-ink: 130.9 62.7% 64.3%;
      --success-ton-1: 136.4 55.0% 10.2%;
      --success-ton-2: 136.0 58.0% 14.5%;

      --warning-ton-2: 37.0 78.0% 15.0%;

      --elev-1: 0px 2px 2px #00000040;
      --elev-4: 0 0 0 1px hsl(0 0% 18%), 0px 16px 32px #00000080;
      --overlay: rgb(0 0 0 / 0.85);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: var(--font-sans);
      font-size: var(--text-xs);
      line-height: 1.5;
      background-color: hsl(var(--background));
      color: hsl(var(--foreground));
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .font-mono {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    svg.icon {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      flex-shrink: 0;
    }

    /* ── 1. Compact Header Bar (40px) ──────────────────────────────────────── */
    .header-bar {
      height: 40px;
      padding: 0 12px;
      background: hsl(var(--background));
      border-bottom: 1px solid hsl(var(--border));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      user-select: none;
    }

    .header-cluster {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .app-title {
      font-size: var(--text-sm);
      font-weight: 600;
      letter-spacing: -0.02em;
      color: hsl(var(--foreground));
      white-space: nowrap;
    }

    .divider-v {
      width: 1px;
      height: 14px;
      background: hsl(var(--border));
      margin: 0 2px;
      flex-shrink: 0;
    }

    /* Compact Inline Stats */
    .stat-summary {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: var(--text-2xs);
      color: hsl(var(--muted-foreground));
      white-space: nowrap;
    }
    .stat-summary strong {
      font-weight: 600;
      color: hsl(var(--foreground));
    }
    .trenner {
      color: hsl(var(--trenner));
    }

    /* Buttons */
    .btn {
      height: 26px;
      padding: 0 8px;
      border-radius: var(--radius-md);
      font-family: var(--font-sans);
      font-size: var(--text-xs);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      border: 0;
      background: hsl(var(--card));
      color: hsl(var(--foreground));
      box-shadow: inset 0 0 0 1px var(--kante-200);
      transition: background-color 100ms ease-out, box-shadow 100ms ease-out, color 100ms ease-out;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn:hover {
      background: hsl(var(--ton-2));
      box-shadow: inset 0 0 0 1px var(--kante-300);
    }
    .btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 2px hsl(var(--ring));
    }
    .btn[aria-pressed="true"] {
      background: hsl(var(--ton-3));
      box-shadow: inset 0 0 0 1px var(--kante-500);
      font-weight: 600;
    }
    .btn:disabled {
      opacity: 0.45;
      pointer-events: none;
    }
    .btn-primary {
      background: hsl(var(--primary));
      color: hsl(var(--primary-foreground));
      box-shadow: none;
    }
    .btn-primary:hover {
      opacity: 0.92;
      background: hsl(var(--primary));
      box-shadow: none;
    }
    .btn-ghost {
      background: transparent;
      box-shadow: none;
      color: hsl(var(--muted-foreground));
    }
    .btn-ghost:hover {
      background: hsl(var(--ton-2));
      color: hsl(var(--foreground));
      box-shadow: none;
    }
    .btn-icon {
      width: 26px;
      padding: 0;
    }

    /* Search Box */
    .search-box {
      position: relative;
      display: flex;
      align-items: center;
      width: 152px;
      height: 26px;
      background: hsl(var(--card));
      border-radius: var(--radius-md);
      box-shadow: inset 0 0 0 1px hsl(var(--input));
      padding: 0 7px;
      gap: 5px;
      transition: width 120ms ease-out, box-shadow 120ms ease-out;
    }
    .search-box:focus-within {
      width: 192px;
      box-shadow: inset 0 0 0 1.5px hsl(var(--ring));
    }
    .search-box input {
      border: 0;
      outline: 0;
      background: transparent;
      color: hsl(var(--foreground));
      font-family: var(--font-sans);
      font-size: var(--text-xs);
      width: 100%;
    }
    .search-box input::placeholder {
      color: hsl(var(--muted-foreground));
    }
    .kbd-hint {
      font-family: var(--font-mono);
      font-size: var(--text-4xs);
      color: hsl(var(--muted-foreground));
      padding: 0 3px;
      border-radius: 2px;
      background: hsl(var(--ton-1));
      box-shadow: inset 0 0 0 1px var(--kante-200);
      pointer-events: none;
    }

    /* ── 2. Sub-Header Document Bars (32px) ────────────────────────────────── */
    .col-bars {
      height: 32px;
      display: grid;
      grid-template-columns: 1fr 24px 1fr 240px;
      background: hsl(var(--ton-1));
      border-bottom: 1px solid hsl(var(--border));
      user-select: none;
    }
    body.sidebar-collapsed .col-bars {
      grid-template-columns: 1fr 24px 1fr 0px;
    }

    .col-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      gap: 8px;
      min-width: 0;
      border-right: 1px solid hsl(var(--border));
    }

    .col-title-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .col-label {
      font-size: var(--text-2xs);
      font-weight: 600;
      color: hsl(var(--muted-foreground));
      flex-shrink: 0;
    }

    .col-filename {
      font-size: var(--text-xs);
      font-weight: 500;
      color: hsl(var(--foreground));
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .col-meta-badge {
      display: none;
      align-items: center;
      height: 16px;
      padding: 0 5px;
      border-radius: var(--radius-sm);
      background: hsl(var(--ton-2));
      box-shadow: inset 0 0 0 1px var(--kante-200);
      font-family: var(--font-mono);
      font-size: var(--text-4xs);
      color: hsl(var(--muted-foreground));
      flex-shrink: 0;
    }
    .col-meta-badge.is-visible {
      display: inline-flex;
    }

    .col-sidebar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      font-size: var(--text-2xs);
      font-weight: 600;
      color: hsl(var(--muted-foreground));
      overflow: hidden;
    }

    /* ── 3. Main Split Workspace ───────────────────────────────────────────── */
    .workspace {
      height: calc(100vh - 72px);
      display: grid;
      grid-template-columns: 1fr 24px 1fr 240px;
      position: relative;
      background: hsl(var(--background));
    }
    body.sidebar-collapsed .workspace {
      grid-template-columns: 1fr 24px 1fr 0px;
    }

    .doc-pane {
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px 20px 80px 20px;
      position: relative;
      scroll-behavior: auto;
      border-right: 1px solid hsl(var(--border));
      background: hsl(var(--card));
    }

    /* Drag & Drop Overlay */
    .drop-zone-overlay {
      position: sticky;
      top: 0;
      left: 0;
      right: 0;
      height: calc(100vh - 104px);
      margin-bottom: calc(-100vh + 104px);
      z-index: 30;
      background: hsl(var(--primary-ton-1) / 0.92);
      border: 1.5px dashed hsl(var(--primary));
      border-radius: var(--radius-md);
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    body.is-dragging-file .drop-zone-overlay,
    .doc-pane.drag-over .drop-zone-overlay {
      display: flex;
    }

    .drop-box {
      padding: 12px 18px;
      background: hsl(var(--card));
      border-radius: var(--radius-md);
      box-shadow: 0 0 0 1px hsl(var(--border)), var(--elev-1);
      text-align: center;
      font-size: var(--text-xs);
      font-weight: 600;
      color: hsl(var(--foreground));
    }

    /* ── Continuous Document Sheet ─────────────────────────────────────────── */
    .doc-sheet {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }

    /* ── PRIME Empty State Pattern ─────────────────────────────────────────── */
    .empty-state {
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 24px;
      max-width: 340px;
      user-select: none;
    }

    .empty-glyph {
      width: 28px;
      height: 28px;
      stroke: hsl(var(--muted-foreground));
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      opacity: 0.45;
      margin-bottom: 12px;
    }

    .empty-title {
      font-size: var(--text-sm);
      font-weight: 600;
      color: hsl(var(--foreground));
      letter-spacing: -0.01em;
    }

    .empty-desc {
      margin-top: 4px;
      font-size: var(--text-xs);
      line-height: 1.45;
      color: hsl(var(--muted-foreground));
    }

    .empty-actions {
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .empty-sample-trigger {
      margin-top: 14px;
      background: transparent;
      border: 0;
      color: hsl(var(--muted-foreground));
      font-family: var(--font-sans);
      font-size: var(--text-2xs);
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: color 100ms ease-out;
    }
    .empty-sample-trigger:hover {
      color: hsl(var(--foreground));
    }

    .empty-state-sm {
      padding: 32px 16px;
      max-width: 220px;
    }
    .empty-state-sm .empty-glyph {
      width: 22px;
      height: 22px;
      margin-bottom: 8px;
    }
    .empty-state-sm .empty-title {
      font-size: var(--text-xs);
    }
    .empty-state-sm .empty-desc {
      font-size: var(--text-2xs);
    }

    .diff-row-anchor {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: stretch;
    }

    .clause.deferred-block {
      content-visibility: auto;
      contain-intrinsic-size: auto none auto 36px;
    }

    /* Continuous Document Paragraph Flow (12px body, 1.5 line-height) */
    .clause {
      flex: 1;
      position: relative;
      padding: 5px 10px;
      border-left: 2px solid transparent;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      font-size: var(--text-xs);
      line-height: 1.5;
      color: hsl(var(--foreground));
      cursor: pointer;
      transition: background-color 80ms ease-out, border-color 80ms ease-out;
    }

    .clause.is-heading {
      font-weight: 600;
      font-size: var(--text-chat-label);
      padding-top: 10px;
      padding-bottom: 2px;
      color: hsl(var(--foreground));
    }

    .clause.state-equal {
      background: transparent;
      border-left-color: transparent;
    }

    .clause.state-modified {
      border-left-color: hsl(var(--primary));
    }

    .clause.state-deleted {
      border-left-color: hsl(var(--destructive));
      background: hsl(var(--destructive-ton-1));
    }

    .clause.state-inserted {
      border-left-color: hsl(var(--success));
      background: hsl(var(--success-ton-1));
    }

    .clause.state-placeholder {
      display: flex;
      align-items: center;
      color: hsl(var(--muted-foreground));
      font-size: var(--text-2xs);
      user-select: none;
      opacity: 0.45;
    }
    .clause.state-placeholder::before {
      content: "";
      flex: 1;
      height: 1px;
      border-top: 1px dashed hsl(var(--border));
    }

    /* Synchronized Mouse-Over Highlight across both documents */
    .clause.is-hovered {
      background: hsl(var(--ton-1));
      border-left-color: hsl(var(--foreground));
    }
    .clause.state-modified.is-hovered {
      background: hsl(var(--ton-1));
      border-left-color: hsl(var(--primary));
    }
    .clause.state-deleted.is-hovered {
      background: hsl(var(--destructive-ton-2));
    }
    .clause.state-inserted.is-hovered {
      background: hsl(var(--success-ton-2));
    }

    .clause.is-active {
      background: hsl(var(--ton-2));
      box-shadow: inset 0 0 0 1px var(--kante-300);
    }

    del.tok-del {
      padding: 1px 3px;
      margin: 0 0.5px;
      border-radius: var(--radius-sm);
      background: hsl(var(--destructive-ton-2));
      color: hsl(var(--destructive-ink));
      text-decoration: line-through;
    }

    ins.tok-ins {
      padding: 1px 3px;
      margin: 0 0.5px;
      border-radius: var(--radius-sm);
      background: hsl(var(--success-ton-2));
      color: hsl(var(--success-ink));
      text-decoration: none;
      font-weight: 500;
    }

    mark.tok-search {
      background: hsl(var(--warning-ton-2));
      color: hsl(var(--foreground));
      border-radius: var(--radius-sm);
      padding: 0 2px;
    }

    body.only-changes .diff-row-anchor[data-type="equal"] {
      display: none;
    }

    /* ── Slim 24px Center Gutter ───────────────────────────────────────────── */
    .center-gutter {
      height: 100%;
      background: hsl(var(--background));
      position: relative;
      overflow: hidden;
      user-select: none;
    }

    #connector-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    .minimap-rail {
      position: absolute;
      top: 8px;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      background: transparent;
      z-index: 1;
    }

    .minimap-tick {
      position: absolute;
      left: 0;
      width: 4px;
      min-height: 4px;
      border-radius: 1px;
      cursor: pointer;
      opacity: 0.7;
    }
    .minimap-tick:hover { opacity: 1; transform: scaleX(1.5); }
    .minimap-tick.mod { background: hsl(var(--primary)); }
    .minimap-tick.ins { background: hsl(var(--success)); }
    .minimap-tick.del { background: hsl(var(--destructive)); }

    /* ── Clean Change List Sidebar ─────────────────────────────────────────── */
    .sidebar-panel {
      height: 100%;
      background: hsl(var(--background));
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .sidebar-footer {
      height: 28px;
      padding: 0 10px;
      border-top: 1px solid hsl(var(--border));
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: var(--text-4xs);
      color: hsl(var(--muted-foreground));
      user-select: none;
      flex-shrink: 0;
    }

    .privacy-status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      background: transparent;
      border: 0;
      font-family: var(--font-mono);
      font-size: var(--text-4xs);
      color: hsl(var(--muted-foreground));
    }
    .privacy-status:hover {
      color: hsl(var(--foreground));
    }
    .privacy-dot {
      width: 6px;
      height: 6px;
      border-radius: 9999px;
      background: hsl(var(--success));
      flex-shrink: 0;
    }

    .nav-item {
      padding: 6px 8px;
      border-radius: var(--radius-md);
      border-left: 2px solid transparent;
      cursor: pointer;
      font-size: var(--text-xs);
      line-height: 1.4;
      color: hsl(var(--muted-foreground));
      transition: background-color 80ms ease-out;
    }
    .nav-item.mod { border-left-color: hsl(var(--primary)); }
    .nav-item.ins { border-left-color: hsl(var(--success)); }
    .nav-item.del { border-left-color: hsl(var(--destructive)); }

    .nav-item:hover,
    .nav-item.is-hovered {
      background: hsl(var(--ton-2));
      color: hsl(var(--foreground));
    }
    .nav-item.is-active {
      background: hsl(var(--ton-3));
      color: hsl(var(--foreground));
    }

    .nav-item-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: var(--text-4xs);
      color: hsl(var(--muted-foreground));
      margin-bottom: 2px;
    }

    .nav-item-snippet {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }

    /* ── Dialogs ───────────────────────────────────────────────────────────── */
    dialog.prime-dialog {
      margin: auto;
      width: min(860px, 92vw);
      background: hsl(var(--card));
      color: hsl(var(--foreground));
      border: 0;
      border-radius: var(--radius-xl);
      box-shadow: 0 0 0 1px hsl(var(--border)), var(--elev-4);
      padding: 0;
    }
    dialog.prime-dialog.dialog-sm {
      width: min(520px, 92vw);
    }
    dialog.prime-dialog::backdrop {
      background: var(--overlay);
      backdrop-filter: blur(2px);
    }
    .dialog-header {
      height: 40px;
      padding: 0 14px;
      border-bottom: 1px solid hsl(var(--border));
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: var(--text-xs);
      font-weight: 600;
    }
    .dialog-body {
      padding: 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .dialog-body-single {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: var(--text-xs);
      line-height: 1.55;
      color: hsl(var(--muted-foreground));
    }
    .sec-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }
    .sec-item {
      padding: 10px 12px;
      border-radius: var(--radius-md);
      background: hsl(var(--ton-1));
      box-shadow: inset 0 0 0 1px var(--kante-200);
    }
    .sec-item-title {
      font-weight: 600;
      color: hsl(var(--foreground));
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .dialog-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: var(--text-xs);
      font-weight: 600;
    }
    .dialog-textarea {
      width: 100%;
      height: min(340px, 55vh);
      padding: 8px 10px;
      background: hsl(var(--card));
      color: hsl(var(--foreground));
      border: 0;
      border-radius: var(--radius-md);
      box-shadow: inset 0 0 0 1px hsl(var(--input));
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      line-height: 1.5;
      resize: vertical;
    }
    .dialog-textarea:focus {
      outline: none;
      box-shadow: inset 0 0 0 1.5px hsl(var(--ring));
    }
    .dialog-footer {
      height: 44px;
      padding: 0 14px;
      background: hsl(var(--ton-1));
      border-top: 1px solid hsl(var(--border));
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    /* ── Responsive & Print Hardening ──────────────────────────────────────── */
    @media (max-width: 960px) {
      .col-bars, .workspace {
        grid-template-columns: 1fr 16px 1fr 0px !important;
      }
      .sidebar-panel, .col-sidebar-head {
        display: none !important;
      }
      .search-box {
        width: 115px;
      }
      .search-box:focus-within {
        width: 145px;
      }
    }

    @media print {
      html, body {
        height: auto !important;
        overflow: visible !important;
        background: #fff !important;
        color: #000 !important;
      }
      .header-bar, .sidebar-panel, .col-sidebar-head, .center-gutter, #btn-upload-left, #btn-upload-right, #btn-swap-docs, .btn-clear-side {
        display: none !important;
      }
      .col-bars {
        grid-template-columns: 1fr 1fr !important;
        height: 28px !important;
        border-bottom: 1px solid #ccc !important;
      }
      .workspace {
        height: auto !important;
        display: grid !important;
        grid-template-columns: 1fr 1fr !important;
      }
      .doc-pane {
        height: auto !important;
        overflow: visible !important;
        padding: 8px 12px !important;
      }
      .clause.deferred-block {
        content-visibility: visible !important;
      }
    }
  </style>
</head>

        return `<del class="tok-del">${escapeAndHighlightText(row.leftBlock.text, query)}</del>`;
      }
      if (row.type === 'modified') {
        return row.wordDiffs
          .filter(part => !part.added)
          .map(part => {
            const content = escapeAndHighlightText(part.value, query);
            return part.removed ? `<del class="tok-del">${content}</del>` : content;
          })
          .join('');
      }
      return '';
    }

    function renderRightBlockHtml(row, query) {
      if (row.type === 'equal') {
        return escapeAndHighlightText(row.rightBlock.text, query);
      }
      if (row.type === 'inserted') {
        return `<ins class="tok-ins">${escapeAndHighlightText(row.rightBlock.text, query)}</ins>`;
      }
      if (row.type === 'modified') {
        return row.wordDiffs
          .filter(part => !part.removed)
          .map(part => {
            const content = escapeAndHighlightText(part.value, query);
            return part.added ? `<ins class="tok-ins">${content}</ins>` : content;
          })
          .join('');
      }
      return '';
    }

    function renderPaneEmptyState(side) {
      const isLeft = side === 'left';
      const title = isLeft ? t('emptyLeftTitle') : t('emptyRightTitle');
      const uploadId = isLeft ? 'btn-empty-upload-left' : 'btn-empty-upload-right';
      return `
        <div class="empty-state" data-empty-state>
          <svg class="empty-glyph" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="12" y1="18" x2="12" y2="12"/>
            <line x1="9" y1="15" x2="15" y2="15"/>
          </svg>
          <h2 class="empty-title">${escapeHtml(title)}</h2>
          <div class="empty-desc">${escapeHtml(t('emptyDesc'))}</div>
          <div class="empty-actions">
            <button type="button" class="btn btn-primary" id="${uploadId}">${escapeHtml(t('chooseFile'))}</button>
            <button type="button" class="btn btn-open-paste">${escapeHtml(t('pasteText'))}</button>
          </div>
          <button type="button" class="empty-sample-trigger btn-load-sample">${escapeHtml(t('loadSample'))}</button>
        </div>
      `;
    }

    function updateColumnMeta(side, blocksCount) {
      const metaEl = document.getElementById(side === 'left' ? 'meta-left' : 'meta-right');
      const clearBtn = document.getElementById(side === 'left' ? 'btn-clear-left' : 'btn-clear-right');
      const fmt = side === 'left' ? state.leftFormat : state.rightFormat;

      if (blocksCount > 0) {
        metaEl.textContent = fmt ? `${fmt} · ${blocksCount} ${t('unitPara')}` : `${blocksCount} ${t('unitPara')}`;
        metaEl.classList.add('is-visible');
        clearBtn.style.display = 'inline-flex';
      } else {
        metaEl.textContent = '';
        metaEl.classList.remove('is-visible');
        clearBtn.style.display = 'none';
      }
    }

    function runComparison() {
      const leftBlocks = parseIntoBlocks(state.leftText);
      const rightBlocks = parseIntoBlocks(state.rightText);

      document.getElementById('filename-left').textContent = state.leftName || t('noFile');
      document.getElementById('filename-right').textContent = state.rightName || t('noFile');

      updateColumnMeta('left', leftBlocks.length);
      updateColumnMeta('right', rightBlocks.length);

      const bothLoaded = leftBlocks.length > 0 && rightBlocks.length > 0;

      if (!bothLoaded) {
        state.alignedRows = [];
        state.changeRows = [];
        document.getElementById('count-all').textContent = '0';
        document.getElementById('count-ins').textContent = '0';
        document.getElementById('count-del').textContent = '0';

        if (leftBlocks.length === 0) {
          setSafeContainerHtml(sheetLeft, renderPaneEmptyState('left'));
        } else {
          setSafeContainerHtml(
            sheetLeft,
            leftBlocks
              .map(
                b =>
                  `<div class="diff-row-anchor" data-type="equal"><div class="clause state-equal ${
                    b.isHeading ? 'is-heading' : ''
                  }">${escapeAndHighlightText(b.text, state.searchQuery)}</div></div>`
              )
              .join('')
          );
        }

        if (rightBlocks.length === 0) {
          setSafeContainerHtml(sheetRight, renderPaneEmptyState('right'));
        } else {
          setSafeContainerHtml(
            sheetRight,
            rightBlocks
              .map(
                b =>
                  `<div class="diff-row-anchor" data-type="equal"><div class="clause state-equal ${
                    b.isHeading ? 'is-heading' : ''
                  }">${escapeAndHighlightText(b.text, state.searchQuery)}</div></div>`
              )
              .join('')
          );
        }

        bindEmptyStateButtons();
        renderSidebarList(bothLoaded);
        minimapTrack.innerHTML = '';
        connectorSvg.innerHTML = '';
        return;
      }

      state.alignedRows = alignDocumentBlocks(leftBlocks, rightBlocks);
      state.changeRows = state.alignedRows.filter(r => r.type !== 'equal');

      const modCount = state.alignedRows.filter(r => r.type === 'modified').length;
      const insCount = state.alignedRows.filter(r => r.type === 'inserted').length;
      const delCount = state.alignedRows.filter(r => r.type === 'deleted').length;

      document.getElementById('count-all').textContent = String(modCount + insCount + delCount);
      document.getElementById('count-ins').textContent = String(insCount + modCount);
      document.getElementById('count-del').textContent = String(delCount + modCount);

      renderDocumentPanes();
      renderSidebarList(true);
      renderMinimap();

      requestAnimationFrame(() => {
        equalizeRowHeights();
        scheduleGutterDraw();
      });
    }

    function bindEmptyStateButtons() {
      const btnL = document.getElementById('btn-empty-upload-left');
      if (btnL) btnL.addEventListener('click', () => document.getElementById('file-input-left').click());

      const btnR = document.getElementById('btn-empty-upload-right');
      if (btnR) btnR.addEventListener('click', () => document.getElementById('file-input-right').click());

          state.leftFormat = 'DEMO';
          state.leftText = sample.v1;
          state.rightName = t('sampleRightName');
          state.rightFormat = 'DEMO';
          state.rightText = sample.v2;
          runComparison();

    function renderDocumentPanes() {
      const leftFragments = [];
      const rightFragments = [];
      const q = state.searchQuery;

      state.alignedRows.forEach((row, idx) => {
        const deferClass = idx > 14 ? 'deferred-block' : '';

        if (row.leftBlock) {
          const headingClass = row.leftBlock.isHeading ? 'is-heading' : '';
          const stateClass =
            row.type === 'equal'
              ? 'state-equal'
              : row.type === 'modified'
              ? 'state-modified'
              : 'state-deleted';

          leftFragments.push(`
            <div class="diff-row-anchor" data-row-id="${row.id}" data-type="${row.type}">
              <div class="clause ${stateClass} ${headingClass} ${deferClass}" data-row-id="${row.id}">${renderLeftBlockHtml(row, q)}</div>
            </div>
          `);
        } else {
          leftFragments.push(`
            <div class="diff-row-anchor" data-row-id="${row.id}" data-type="${row.type}">
              <div class="clause state-placeholder ${deferClass}" data-row-id="${row.id}"></div>
            </div>
          `);
        }

        if (row.rightBlock) {
          const headingClass = row.rightBlock.isHeading ? 'is-heading' : '';
          const stateClass =
            row.type === 'equal'
              ? 'state-equal'
              : row.type === 'modified'
              ? 'state-modified'
              : 'state-inserted';

          rightFragments.push(`
            <div class="diff-row-anchor" data-row-id="${row.id}" data-type="${row.type}">
              <div class="clause ${stateClass} ${headingClass} ${deferClass}" data-row-id="${row.id}">${renderRightBlockHtml(row, q)}</div>
            </div>
          `);
        } else {
          rightFragments.push(`
            <div class="diff-row-anchor" data-row-id="${row.id}" data-type="${row.type}">
              <div class="clause state-placeholder ${deferClass}" data-row-id="${row.id}"></div>
            </div>
          `);
        }
      });

      setSafeContainerHtml(sheetLeft, leftFragments.join(''));
      setSafeContainerHtml(sheetRight, rightFragments.join(''));
    }

    function equalizeRowHeights() {
      const leftAnchors = sheetLeft.querySelectorAll('.diff-row-anchor');
      const rightAnchors = sheetRight.querySelectorAll('.diff-row-anchor');
      const len = Math.min(leftAnchors.length, rightAnchors.length);

      for (let i = 0; i < len; i++) {
        const lBlock = leftAnchors[i].firstElementChild;
        const rBlock = rightAnchors[i].firstElementChild;
        if (!lBlock || !rBlock) continue;
        lBlock.style.minHeight = '';
        rBlock.style.minHeight = '';
      }

      const heights = new Array(len);
      for (let i = 0; i < len; i++) {
        const lBlock = leftAnchors[i].firstElementChild;
        const rBlock = rightAnchors[i].firstElementChild;
        if (!lBlock || !rBlock) {
          heights[i] = 0;
          continue;
        }
        heights[i] = Math.max(lBlock.offsetHeight, rBlock.offsetHeight);
      }

      for (let i = 0; i < len; i++) {
        if (!heights[i]) continue;
        leftAnchors[i].firstElementChild.style.minHeight = `${heights[i]}px`;
        rightAnchors[i].firstElementChild.style.minHeight = `${heights[i]}px`;
      }
    }

    function renderSidebarList(bothLoaded) {
      if (!bothLoaded) {
        setSafeContainerHtml(
          sidebarList,
          `
          <div class="empty-state empty-state-sm" data-empty-state>
            <svg class="empty-glyph" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M16 3h5v5"/><path d="M8 3H3v5"/><path d="M12 22v-8.3a4 4 0 0 0-1.172-2.872L3 3"/><path d="m15 9 6-6"/>
            </svg>
            <p class="empty-title">${escapeHtml(t('sidebarEmptyTitle'))}</p>
            <div class="empty-desc">${escapeHtml(t('sidebarEmptyDesc'))}</div>
          </div>

        );

      }

      const filtered = state.changeRows.filter(row => {
        if (state.searchQuery.trim().length >= 2) {
          const q = state.searchQuery.toLowerCase();
          const lText = row.leftBlock ? row.leftBlock.text.toLowerCase() : '';
          const rText = row.rightBlock ? row.rightBlock.text.toLowerCase() : '';
          return lText.includes(q) || rText.includes(q);
        }

      });

      if (filtered.length === 0) {
        const isSearch = state.searchQuery.trim().length >= 2;
        setSafeContainerHtml(
          sidebarList,
          `
          <div class="empty-state empty-state-sm" data-empty-state>
            <svg class="empty-glyph" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            <p class="empty-title">${escapeHtml(isSearch ? t('noMatchesTitle') : t('identicalTitle'))}</p>
            <div class="empty-desc">${escapeHtml(isSearch ? t('noMatchesDesc') : t('identicalDesc'))}</div>
          </div>

      }

      setSafeContainerHtml(
        sidebarList,
        filtered
          .map((row, idx) => {

              row.type === 'modified' ? t('typeMod') : row.type === 'inserted' ? t('typeIns') : t('typeDel');

            const snippetHtml =
              row.type === 'deleted'
                ? renderLeftBlockHtml(row, state.searchQuery)

            return `
              <div class="nav-item ${cls}" data-row-id="${row.id}">
                <div class="nav-item-head">
                  <span>${idx + 1} · ${escapeHtml(refCode)}</span>

                <div class="nav-item-snippet">${snippetHtml}</div>

    function renderMinimap() {
      const totalRows = state.alignedRows.length || 1;
      setSafeContainerHtml(
        minimapTrack,
        state.changeRows
          .map(row => {
            const pct = ((row.rowNumber - 1) / totalRows) * 100;
            const cls = row.type === 'modified' ? 'mod' : row.type === 'inserted' ? 'ins' : 'del';
            return `<div class="minimap-tick ${cls}" style="top: ${pct}%" data-row-id="${row.id}"></div>`;
          })
          .join('')
      );
    }

    let gutterRafPending = false;
    function scheduleGutterDraw() {
      if (gutterRafPending) return;
      gutterRafPending = true;
      requestAnimationFrame(() => {
        gutterRafPending = false;
        drawGutterConnectors();
      });
    }

    function drawGutterConnectors() {
      const gutterRect = connectorSvg.getBoundingClientRect();
      if (!gutterRect.width || !gutterRect.height) return;

      const targetIds = new Set([state.hoveredRowId, state.activeRowId].filter(Boolean));
      if (targetIds.size === 0) {
        connectorSvg.innerHTML = '';
        return;
      }

      const paths = [];
      const w = gutterRect.width;

      targetIds.forEach(rowId => {
        const leftEl = sheetLeft.querySelector(`.clause[data-row-id="${rowId}"]`);
        const rightEl = sheetRight.querySelector(`.clause[data-row-id="${rowId}"]`);
        if (!leftEl || !rightEl) return;

        const lRect = leftEl.getBoundingClientRect();
        const rRect = rightEl.getBoundingClientRect();

        const yLeft = lRect.top + lRect.height / 2 - gutterRect.top;
        const yRight = rRect.top + rRect.height / 2 - gutterRect.top;

        const d = `M 0 ${yLeft} C ${w * 0.45} ${yLeft}, ${w * 0.55} ${yRight}, ${w} ${yRight}`;
        paths.push(`<path d="${d}" fill="none" stroke="hsl(var(--ring))" stroke-width="1.5" />`);
      });

      connectorSvg.innerHTML = paths.join('');
    }

    function setHoveredRow(rowId) {
      if (state.hoveredRowId === rowId) return;
      state.hoveredRowId = rowId;

      document.querySelectorAll('.clause.is-hovered, .nav-item.is-hovered').forEach(el => {
        el.classList.remove('is-hovered');
      });

      if (rowId) {
        document.querySelectorAll(`[data-row-id="${rowId}"]`).forEach(el => {
          if (el.classList.contains('clause') || el.classList.contains('nav-item')) {
            el.classList.add('is-hovered');
          }
        });
      }
      scheduleGutterDraw();
    }

    function selectAndScrollToRow(rowId, smooth = true) {
      state.activeRowId = rowId;
      document.querySelectorAll('.clause.is-active, .nav-item.is-active').forEach(el => {
        el.classList.remove('is-active');
      });

      if (!rowId) return;

      document.querySelectorAll(`[data-row-id="${rowId}"]`).forEach(el => {
        if (el.classList.contains('clause') || el.classList.contains('nav-item')) {
          el.classList.add('is-active');
        }
      });

      const leftTarget = sheetLeft.querySelector(`.clause[data-row-id="${rowId}"]`);
      const rightTarget = sheetRight.querySelector(`.clause[data-row-id="${rowId}"]`);
      const navTarget = sidebarList.querySelector(`.nav-item[data-row-id="${rowId}"]`);

      state.isProgrammaticScroll = true;

      if (leftTarget) {
        const topOffset = leftTarget.offsetTop - paneLeft.clientHeight / 3;
        paneLeft.scrollTo({ top: Math.max(0, topOffset), behavior: smooth ? 'smooth' : 'auto' });
      }
      if (rightTarget) {
        const topOffset = rightTarget.offsetTop - paneRight.clientHeight / 3;
        paneRight.scrollTo({ top: Math.max(0, topOffset), behavior: smooth ? 'smooth' : 'auto' });
      }
      if (navTarget) {
        navTarget.scrollIntoView({ block: 'nearest', behavior: smooth ? 'smooth' : 'auto' });
      }

      setTimeout(() => {
        state.isProgrammaticScroll = false;
        scheduleGutterDraw();
      }, smooth ? 300 : 40);
    }

    [sheetLeft, sheetRight, sidebarList].forEach(container => {
      container.addEventListener('mouseover', e => {
        const target = e.target.closest('[data-row-id]');
        if (target) setHoveredRow(target.getAttribute('data-row-id'));
      });
      container.addEventListener('mouseleave', () => setHoveredRow(null));
      container.addEventListener('click', e => {
        const target = e.target.closest('[data-row-id]');
        if (target) selectAndScrollToRow(target.getAttribute('data-row-id'), true);
      });
    });

    minimapTrack.addEventListener('click', e => {
      const tick = e.target.closest('[data-row-id]');
      if (tick) selectAndScrollToRow(tick.getAttribute('data-row-id'), true);
    });

    let activeScrollSide = null;
    let scrollUnlockTimer = null;

    function handlePaneScroll(sourcePane, targetPane, side) {
      scheduleGutterDraw();
      if (!state.syncScroll || state.isProgrammaticScroll) return;
      if (activeScrollSide && activeScrollSide !== side) return;
      activeScrollSide = side;

      targetPane.scrollTop = sourcePane.scrollTop;

      clearTimeout(scrollUnlockTimer);
      scrollUnlockTimer = setTimeout(() => {
        activeScrollSide = null;
      }, 80);
    }

    paneLeft.addEventListener('scroll', () => handlePaneScroll(paneLeft, paneRight, 'left'), { passive: true });
    paneRight.addEventListener('scroll', () => handlePaneScroll(paneRight, paneLeft, 'right'), { passive: true });

    function attachScrollEnd(scroller, callback) {
      if ('onscrollend' in window) {
        scroller.addEventListener('scrollend', callback, { passive: true });
      } else {
        let timer = null;
        scroller.addEventListener('scroll', () => {
          clearTimeout(timer);
          timer = setTimeout(callback, 100);
        }, { passive: true });
      }
    }

    attachScrollEnd(paneLeft, () => { activeScrollSide = null; scheduleGutterDraw(); });
    attachScrollEnd(paneRight, () => { activeScrollSide = null; scheduleGutterDraw(); });

    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        equalizeRowHeights();
        scheduleGutterDraw();
      }, 60);
    });

    async function extractPdfText(arrayBuffer) {
      const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      const pageTexts = [];

      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const textContent = await page.getTextContent();
        let lastY = null;
        let currentLine = '';
        const lines = [];

        for (const item of textContent.items) {
          const str = item.str;
          if (!str) continue;
          const y = item.transform ? item.transform[5] : 0;

          if (lastY !== null && Math.abs(y - lastY) > 6) {
            if (currentLine.trim()) lines.push(currentLine.trim());
            if (Math.abs(y - lastY) > 16) lines.push('');
            currentLine = str;
          } else {
            currentLine += (currentLine && !currentLine.endsWith(' ') && !str.startsWith(' ') ? ' ' : '') + str;
          }
          lastY = y;
        }
        if (currentLine.trim()) lines.push(currentLine.trim());

        const paragraphs = [];
        let buffer = '';
        for (const line of lines) {
          if (!line) {
            if (buffer) {
              paragraphs.push(buffer);
              buffer = '';
            }
            continue;
          }
          const isNewClause = /^(§\s*\d+|\(\d+\)|\d+\.\d*|\([a-z]\)|Artikel\s+\d+|Anlage\s+\d+|Section\s+\d+)\s/.test(line);
          if (isNewClause && buffer) {
            paragraphs.push(buffer);
            buffer = line;
          } else {
            buffer = buffer ? `${buffer} ${line}` : line;
          }
        }
        if (buffer) paragraphs.push(buffer);
        pageTexts.push(paragraphs.join('\n\n'));
      }
      return pageTexts.join('\n\n');
    }

    async function extractDocxText(arrayBuffer) {
      const result = await window.mammoth.extractRawText({ arrayBuffer });
      return result.value;
    }

    async function handleFileUpload(file, side) {
      if (!file) return;
      const fnLabel = document.getElementById(side === 'left' ? 'filename-left' : 'filename-right');
      const prevName = fnLabel.textContent;
      fnLabel.textContent = `${t('readingFile')} ${file.name}…`;

      try {
        const ext = (file.name.split('.').pop() || '').toLowerCase();
        let extractedText = '';

        if (ext === 'pdf') {
          const buffer = await file.arrayBuffer();
          extractedText = await extractPdfText(buffer);
        } else if (ext === 'docx') {
          const buffer = await file.arrayBuffer();
          extractedText = await extractDocxText(buffer);
        } else {
          extractedText = await file.text();
        }

        if (side === 'left') {
          state.leftName = file.name;
          state.leftFormat = ext.toUpperCase() || 'TEXT';
          state.leftText = extractedText;
        } else {
          state.rightName = file.name;
          state.rightFormat = ext.toUpperCase() || 'TEXT';
          state.rightText = extractedText;
        }
        runComparison();
      } catch (err) {
        fnLabel.textContent = prevName;
        alert(`${t('readError')} "${file.name}": ${err.message}`);
      }
    }

    let dragCounter = 0;
    window.addEventListener('dragenter', e => {
      if (e.dataTransfer && e.dataTransfer.types && e.dataTransfer.types.includes('Files')) {
        dragCounter++;
        document.body.classList.add('is-dragging-file');
      }
    });
    window.addEventListener('dragleave', () => {
      dragCounter = Math.max(0, dragCounter - 1);
      if (dragCounter === 0) document.body.classList.remove('is-dragging-file');
    });
    window.addEventListener('dragover', e => e.preventDefault());
    window.addEventListener('drop', e => {
      e.preventDefault();
      dragCounter = 0;
      document.body.classList.remove('is-dragging-file');
    });

    async function handleDropFiles(files, targetSide) {
      if (!files || !files.length) return;
      if (files.length >= 2) {
        await handleFileUpload(files[0], 'left');
        await handleFileUpload(files[1], 'right');
      } else {
        await handleFileUpload(files[0], targetSide);
      }
    }

    [
      { el: paneLeft, side: 'left' },
      { el: paneRight, side: 'right' },
      { el: document.querySelector('.col-bar-left'), side: 'left' },
      { el: document.querySelector('.col-bar-right'), side: 'right' },
    ].forEach(({ el, side }) => {
      if (!el) return;
      el.addEventListener('dragover', e => {
        e.preventDefault();
        (side === 'left' ? paneLeft : paneRight).classList.add('drag-over');
      });
      el.addEventListener('dragleave', () => {
        (side === 'left' ? paneLeft : paneRight).classList.remove('drag-over');
      });
      el.addEventListener('drop', async e => {
        e.preventDefault();
        e.stopPropagation();
        dragCounter = 0;
        document.body.classList.remove('is-dragging-file');
        paneLeft.classList.remove('drag-over');
        paneRight.classList.remove('drag-over');
        await handleDropFiles(e.dataTransfer.files, side);
      });
    });

    const fileInputLeft = document.getElementById('file-input-left');
    const fileInputRight = document.getElementById('file-input-right');
    document.getElementById('btn-upload-left').addEventListener('click', () => fileInputLeft.click());
    document.getElementById('btn-upload-right').addEventListener('click', () => fileInputRight.click());
    fileInputLeft.addEventListener('change', e => handleFileUpload(e.target.files[0], 'left'));
    fileInputRight.addEventListener('change', e => handleFileUpload(e.target.files[0], 'right'));

    document.getElementById('btn-clear-left').addEventListener('click', () => {
      state.leftText = '';
      state.leftName = '';
      state.leftFormat = '';
      fileInputLeft.value = '';
      runComparison();
    });

    document.getElementById('btn-clear-right').addEventListener('click', () => {
      state.rightText = '';
      state.rightName = '';
      state.rightFormat = '';
      fileInputRight.value = '';
      runComparison();
    });

    function stepChange(direction) {
      if (!state.changeRows.length) return;
      const curIdx = state.changeRows.findIndex(r => r.id === state.activeRowId);
      let nextIdx = 0;
      if (curIdx === -1) {
        nextIdx = direction > 0 ? 0 : state.changeRows.length - 1;
      } else {
        nextIdx = (curIdx + direction + state.changeRows.length) % state.changeRows.length;
      }
      selectAndScrollToRow(state.changeRows[nextIdx].id, true);
    }

    document.getElementById('btn-prev').addEventListener('click', () => stepChange(-1));
    document.getElementById('btn-next').addEventListener('click', () => stepChange(1));

    const searchInput = document.getElementById('search-input');

    window.addEventListener('keydown', e => {
      if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
        if (e.key === 'Escape') document.activeElement.blur();
        return;
      }
      if (e.key === 'j' || e.key === 'J') {
        e.preventDefault();
        stepChange(1);
      } else if (e.key === 'k' || e.key === 'K') {
        e.preventDefault();
        stepChange(-1);
      } else if (e.key === '/') {
        e.preventDefault();
        searchInput.focus();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        document.getElementById('btn-only-changes').click();
      }
    });

    const btnSyncScroll = document.getElementById('btn-sync-scroll');
    btnSyncScroll.addEventListener('click', () => {
      state.syncScroll = !state.syncScroll;
      btnSyncScroll.setAttribute('aria-pressed', String(state.syncScroll));
    });

    const btnOnlyChanges = document.getElementById('btn-only-changes');
    btnOnlyChanges.addEventListener('click', () => {
      state.onlyChanges = !state.onlyChanges;
      document.body.classList.toggle('only-changes', state.onlyChanges);
      btnOnlyChanges.setAttribute('aria-pressed', String(state.onlyChanges));
      requestAnimationFrame(() => {
        equalizeRowHeights();
        scheduleGutterDraw();
      });
    });

    document.getElementById('btn-print').addEventListener('click', () => {
      window.print();
    });

    document.getElementById('btn-clear').addEventListener('click', () => {
      state.leftText = '';
      state.rightText = '';
      state.leftName = '';
      state.rightName = '';
      state.leftFormat = '';
      state.rightFormat = '';
      state.activeRowId = null;
      state.hoveredRowId = null;
      state.searchQuery = '';
      searchInput.value = '';
      fileInputLeft.value = '';
      fileInputRight.value = '';
      runComparison();
    });

    document.getElementById('btn-lang').addEventListener('click', () => {
      state.lang = state.lang === 'de' ? 'en' : 'de';
      // If demo sample is currently loaded, switch sample language too
      if (state.leftFormat === 'DEMO' && state.rightFormat === 'DEMO') {
        const sample = SAMPLES[state.lang] || SAMPLES.de;
        state.leftName = t('sampleLeftName');
        state.leftText = sample.v1;
        state.rightName = t('sampleRightName');
        state.rightText = sample.v2;
      }
      applyTranslationsToStaticDom();
      runComparison();
    });

    document.getElementById('btn-theme').addEventListener('click', () => {
      const isDark = document.documentElement.classList.toggle('dark');
      document.getElementById('icon-theme').innerHTML = isDark
        ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>'
        : '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>';
      scheduleGutterDraw();
    });

    const btnToggleSidebar = document.getElementById('btn-toggle-sidebar');
    btnToggleSidebar.addEventListener('click', () => {
      const collapsed = document.body.classList.toggle('sidebar-collapsed');
      btnToggleSidebar.setAttribute('aria-pressed', String(!collapsed));
      requestAnimationFrame(() => {
        equalizeRowHeights();
        scheduleGutterDraw();
      });
    });

    document.getElementById('btn-swap-docs').addEventListener('click', () => {
      [state.leftText, state.rightText] = [state.rightText, state.leftText];
      [state.leftName, state.rightName] = [state.rightName, state.leftName];
      [state.leftFormat, state.rightFormat] = [state.rightFormat, state.leftFormat];
      runComparison();
    });

    searchInput.addEventListener('input', e => {
      state.searchQuery = e.target.value;
      if (state.alignedRows.length > 0) {
        renderDocumentPanes();
        renderSidebarList(true);
        requestAnimationFrame(() => {
          equalizeRowHeights();
          scheduleGutterDraw();
        });
      } else {
        runComparison();
      }
    });

    const pasteModal = document.getElementById('paste-modal');
    const textareaLeft = document.getElementById('textarea-left');
    const textareaRight = document.getElementById('textarea-right');

    function openPasteModal() {
      textareaLeft.value = state.leftText;
      textareaRight.value = state.rightText;
      pasteModal.showModal();
    }

    document.getElementById('btn-paste-modal').addEventListener('click', openPasteModal);
    document.getElementById('btn-close-modal').addEventListener('click', () => pasteModal.close());
    document.getElementById('btn-cancel-modal').addEventListener('click', () => pasteModal.close());
    document.getElementById('btn-apply-modal').addEventListener('click', () => {
      state.leftText = textareaLeft.value;
      state.rightText = textareaRight.value;
      if (state.leftText.trim() && !state.leftName) {
        state.leftName = t('manualLeft');
        state.leftFormat = 'TEXT';
      }
      if (state.rightText.trim() && !state.rightName) {
        state.rightName = t('manualRight');
        state.rightFormat = 'TEXT';
      }
      pasteModal.close();
      runComparison();
    });

    const privacyModal = document.getElementById('privacy-modal');
    document.getElementById('btn-privacy-info').addEventListener('click', () => privacyModal.showModal());
    document.getElementById('btn-close-privacy').addEventListener('click', () => privacyModal.close());
    document.getElementById('btn-ok-privacy').addEventListener('click', () => privacyModal.close());

    [pasteModal, privacyModal].forEach(dlg => {
      dlg.addEventListener('click', e => {
        if (e.target === dlg) dlg.close();
      });
    });

    window.addEventListener('DOMContentLoaded', () => {
      applyTranslationsToStaticDom();
      runComparison();
    });
  </script>
</body>
</html>
