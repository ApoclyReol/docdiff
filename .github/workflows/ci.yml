name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify standalone bundle
        run: |
          python3 scripts/build.py
          node scripts/check.mjs
          git diff --exit-code site DocDiff.html DocDiff_简体中文.html
          test -z "$(git status --porcelain -- site DocDiff.html DocDiff_简体中文.html)" || { git status --short -- site DocDiff.html DocDiff_简体中文.html; echo "Commit the rebuilt files"; exit 1; }
